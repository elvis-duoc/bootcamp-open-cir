<main id="vista"></main>

<!-- La sala del video vive fuera de la vista: mover o redibujar el reproductor recargaría YouTube -->
<section class="sala" id="sala" hidden>
  <header class="sala-top">
    <button class="circ" id="s-salir" aria-label="Volver a las estaciones"><svg class="i"><use href="#i-back"/></svg></button>
    <b id="s-titulo"></b>
  </header>
  <div class="escena" id="escena">
    <div class="vid" id="vid">
      <div id="yt"></div>
      <div class="demo" id="demo" hidden><span>Video de ensayo</span><b id="demo-t"></b></div>
      <div class="capa-clic" id="capa-clic"></div>
      <button class="bigplay" id="bigplay" aria-label="Reproducir"><svg class="i"><use href="#i-play"/></svg></button>
    </div>
    <div class="cierre" id="cierre" hidden></div>
  </div>
  <footer class="ctrl" id="ctrl">
    <button class="circ" id="b-play" aria-label="Reproducir o pausar"></button>
    <button class="circ" id="b-back" title="Volver 10 segundos" aria-label="Volver 10 segundos"><svg class="i"><use href="#i-redo"/></svg></button>
    <span class="tiempo" id="tiempo"></span>
    <div class="linea" id="linea" role="slider" aria-label="Avance de la misión" tabindex="0"><i id="l-fill"></i></div>
    <button class="chip-btn cc" id="b-cc" type="button" aria-pressed="false" aria-label="Subtítulos" hidden><svg class="i"><use href="#i-subs"/></svg></button>
    <button class="chip-btn" id="b-full"></button>
  </footer>
</section>
