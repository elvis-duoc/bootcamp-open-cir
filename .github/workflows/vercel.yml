# CI: en cada cambio revisa que el sitio esté completo (archivos, sintaxis, imágenes y programas precompilados).
# La publicación (CD) la hace Vercel por su cuenta, conectado a este repositorio:
#  · push a main      → producción
#  · otras ramas / PR → vista previa
# Si esta verificación falla, se ve en la pestaña Actions y en el pull request.
name: Verificar el sitio

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: Verificar el sitio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/verificar.mjs
